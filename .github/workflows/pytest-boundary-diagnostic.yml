name: Pytest Boundary Diagnostic

on:
  pull_request:
    paths:
      - "src/ev4_transition/pcvp_*.py"
      - "tests/producer_integration/test_pcvp_*.py"
      - ".github/workflows/pytest-boundary-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-boundary-tests:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: files
        shell: bash
        run: |
          files="$(find tests/boundary -maxdepth 1 -type f -name 'test_*.py' -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  boundary-file:
    name: boundary-${{ matrix.file }}
    needs: discover-boundary-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-boundary-tests.outputs.files) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.7.22"
      - run: uv sync --locked --extra dev --extra ui --quiet
      - run: uv run pytest -vv "tests/boundary/${{ matrix.file }}"
