name: Pytest Scope Diagnostic

on:
  pull_request:
    paths:
      - "src/ev4_transition/pcvp_*.py"
      - "tests/producer_integration/test_pcvp_*.py"
      - ".github/workflows/pytest-scope-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-scope:
    name: pytest-scope-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit
            target: tests/unit
          - name: service
            target: tests/service
          - name: producer
            target: tests/producer_integration
          - name: transitions
            target: tests/transitions
          - name: reports-planning
            target: tests/reports tests/planning
          - name: kernel-ui
            target: tests/kernel_decision_intake tests/ui
          - name: remaining
            target: >-
              tests
              --ignore=tests/unit
              --ignore=tests/service
              --ignore=tests/producer_integration
              --ignore=tests/transitions
              --ignore=tests/reports
              --ignore=tests/planning
              --ignore=tests/kernel_decision_intake
              --ignore=tests/ui
    steps:
      - name: Checkout exact Project Gate source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.7.22"
          enable-cache: true
      - name: Install locked Project Gate
        run: uv sync --locked --extra dev --extra ui --quiet
      - name: Run scoped pytest
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: uv run pytest -vv $TARGET
